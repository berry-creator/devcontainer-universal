name: Build devcontainer image and publish to Docker Hub

on:
  push:
    tags:
      - '*'

env:
  DOCKERHUB_REPO: letsdone/devcontainer-universal

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.repository.owner.id == github.event.sender.id
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            suffix: ''
            latest: true
            claude: false
            gemini: false
            codex: false
          - name: codex
            suffix: '-codex'
            latest: false
            claude: false
            gemini: false
            codex: true
          - name: gemini
            suffix: '-gemini'
            latest: false
            claude: false
            gemini: true
            codex: false
          - name: claude
            suffix: '-claude'
            latest: false
            claude: true
            gemini: false
            codex: false
          - name: all
            suffix: '-all'
            latest: false
            claude: true
            gemini: true
            codex: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate image version
        run: echo "APP_VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        run: |
          tags="${DOCKERHUB_REPO}:${APP_VERSION}${{ matrix.suffix }}"
          if [ "${{ matrix.latest }}" = "true" ]; then
            tags="${tags},${DOCKERHUB_REPO}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CLAUDE_PREINSTALLED=${{ matrix.claude }}
            GEMINI_PREINSTALLED=${{ matrix.gemini }}
            CODEX_PREINSTALLED=${{ matrix.codex }}
